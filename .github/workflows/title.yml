# Checks a pull request's title is a Conventional Commit: squashing writes it to main, and the
# release notes are grouped by it.

name: title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read # the title, and the pull request it belongs to
    steps:
      - name: The title is a Conventional Commit
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # CONTRIBUTING.md lists the same types, and .goreleaser.yaml groups the notes by them.
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          # Squashing a pull request of one commit writes that commit's message to main, not
          # the title, so hold the commit to the same form.
          validateSingleCommit: true
